<!DOCTYPE html>
<html>
<head>
  <title>Distributed ATC Radar</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body style="background-color:black; color:white;">
  <h2 style="text-align:center;">Distributed ATC Radar</h2>
  <div id="radar" style="width:800px;height:600px;margin:auto;"></div>

  <script>
    async function fetchAircraft() {
      try {
        const resp = await fetch("/aircraft");
        return await resp.json();
      } catch (err) {
        console.error("Error fetching aircraft:", err);
        return [];
      }
    }

    async function updateRadar() {
      const aircraft = await fetchAircraft();

      const traces = aircraft.map(a => ({
        x: [a.pos[0]],
        y: [a.pos[1]],
        mode: "markers+text",
        type: "scatter",
        text: a.id,
        textposition: "top center",
        marker: { size: 12, color: a.controller === 1 ? "blue" : "red" },
        name: a.id
      }));

      const layout = {
        paper_bgcolor: "black",
        plot_bgcolor: "black",
        xaxis: { range: [0, 600], color: "white" },
        yaxis: { range: [0, 400], color: "white" },
        showlegend: true,
        title: { text: "Aircraft Positions", font: { color: "white" } }
      };

      Plotly.newPlot("radar", traces, layout);
    }

    // Update every second
    setInterval(updateRadar, 1000);
    updateRadar();
  </script>
</body>
</html>
