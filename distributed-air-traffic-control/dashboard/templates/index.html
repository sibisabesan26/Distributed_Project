<!DOCTYPE html>
<html>
<head>
  <title>ATC Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <h1>Aircraft Positions (Live)</h1>
  <div id="plot"></div>

  <h2>Controller States</h2>
  <ul id="nodes"></ul>

  <h2>Message Log (last 10 events)</h2>
  <ul id="logs"></ul>

  <script>
    async function updateDashboard() {
      try {
        // Fetch aircraft
        let aircraftRes = await fetch("http://127.0.0.1:5000/aircraft");
        let aircraft = await aircraftRes.json();

        // Group by controller
        let controllers = {};
        aircraft.forEach(a => {
          if (!controllers[a.controller]) controllers[a.controller] = [];
          controllers[a.controller].push(a);
        });

        // Create traces per controller
        let traces = Object.entries(controllers).map(([controller, group]) => {
          return {
            x: group.map(a => a.pos[0]),
            y: group.map(a => a.pos[1]),
            mode: 'markers+text',
            text: group.map(a => a.id),
            textposition: 'top center',
            marker: {
              size: 12,
              color: controller == 1 ? 'blue' : 'red'
            },
            name: `Controller ${controller}`
          };
        });

        Plotly.newPlot('plot', traces, {
          title: 'Aircraft Scatter Plot',
          xaxis: {range: [0, 600]},
          yaxis: {range: [0, 400]}
        });

        // Fetch nodes
        let nodesRes = await fetch("http://127.0.0.1:5000/nodes");
        let nodes = await nodesRes.json();
        document.getElementById("nodes").innerHTML =
          Object.entries(nodes).map(([id, state]) =>
            `<li>Node ${id}: ${state.state}</li>`).join("");

        // Fetch logs
        let logsRes = await fetch("http://127.0.0.1:5000/logs");
        let logs = await logsRes.json();
        document.getElementById("logs").innerHTML =
          logs.slice(-10).map(log =>
            `<li>${log.event} - Node ${log.node} - Aircraft ${log.aircraft}</li>`).join("");

      } catch (err) {
        console.error("Error updating dashboard:", err);
      }
    }

    // Update every second
    setInterval(updateDashboard, 1000);
    updateDashboard();
  </script>
</body>
</html>
